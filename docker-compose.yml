services:
  backend:
    build: ./backend
    container_name: backend
    networks:
      - appnet
    restart: always


  nginx:
    image: nginx:alpine
    container_name: rebuild_proxy
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - appnet
    restart: always

networks:
  appnet:
